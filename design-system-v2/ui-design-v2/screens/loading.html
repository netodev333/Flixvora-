<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flixvora - Loading States</title>
  <link rel="stylesheet" href="../styles/design-system.css">
  <link rel="stylesheet" href="../styles/animations.css">
  <style>
    body { padding-bottom: 80px; }
    .mobile-screen { max-width: 390px; margin: 0 auto; min-height: 100vh; background: var(--bg-deep); }
    .back-link { display: flex; align-items: center; gap: var(--space-2); color: var(--text-gray-300); text-decoration: none; font-size: var(--text-sm); font-weight: 500; }
    .loading-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-6); }
  </style>
</head>
<body class="page-transition animate-fade-in">

  <div class="mobile-screen">
    <a href="../index.html" style="position: absolute; top: var(--space-4); left: var(--space-4); z-index: 100;">
      <div class="back-link">← Back</div>
    </a>

    <nav class="nav-top">
      <a href="#" class="nav-brand">⏳ Loading</a>
      <div class="nav-actions">
        <button class="nav-icon-btn">🔍</button>
        <div class="avatar">JD</div>
      </div>
    </nav>

    <div style="padding: var(--space-6) var(--space-4) var(--space-100);">

      <!-- Page Loading -->
      <div style="text-align: center; padding: var(--space-12);">
        <div class="loading-spinner" style="margin: 0 auto var(--space-4);"></div>
        <div class="text-lg font-bold">Loading Content...</div>
        <div class="text-sm text-gray-500 mt-2">Please wait while we fetch your content</div>
      </div>

      <!-- Skeleton Card -->
      <div class="loading-card">
        <div class="text-base font-semibold mb-4">Skeleton Loading States</div>
        
        <div style="margin-bottom: var(--space-4);">
          <div class="skeleton-title mb-4"></div>
          <div class="skeleton-text" style="width: 80%;"></div>
          <div class="skeleton-text" style="width: 60%;"></div>
          <div class="skeleton-text" style="width: 40%;"></div>
        </div>

        <div style="display: flex; gap: var(--space-4); margin-bottom: var(--space-4);">
          <div class="skeleton-avatar"></div>
          <div style="flex: 1;">
            <div class="skeleton-title" style="width: 60%;"></div>
            <div class="skeleton-text" style="width: 100%;"></div>
          </div>
        </div>

        <div style="display: flex; gap: var(--space-4); overflow-x: auto;">
          <div class="skeleton" style="width: 120px; height: 180px;"></div>
          <div class="skeleton" style="width: 120px; height: 180px;"></div>
          <div class="skeleton" style="width: 120px; height: 180px;"></div>
          <div class="skeleton" style="width: 120px; height: 180px;"></div>
        </div>
      </div>

      <!-- Button Loading -->
      <div class="loading-card">
        <div class="text-base font-semibold mb-4">Button Loading States</div>
        
        <div style="margin-bottom: var(--space-4);">
          <button class="btn btn-primary btn-full" style="position: relative; overflow: hidden;">
            <span class="loading-spinner" style="width: 20px; height: 20px; border-width: 2px; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);"></span>
            <span style="opacity: 0;">Loading...</span>
          </button>
        </div>

        <div style="margin-bottom: var(--space-4);">
          <button class="btn btn-secondary btn-full">Retry</button>
        </div>
      </div>

      <!-- Image Loading -->
      <div class="loading-card">
        <div class="text-base font-semibold mb-4">Image Placeholder</div>
        
        <div style="width: 100%; height: 200px; background: #1A1A1A; border-radius: var(--radius-lg); position: relative; overflow: hidden;">
          <div class="skeleton-shimmer" style="width: 100%; height: 100%;"></div>
          <div style="position: absolute; bottom: var(--space-3); left: var(--space-3); color: white; font-weight: 600;">Movie Poster</div>
        </div>
      </div>

    </div>

    <nav class="nav-mobile">
      <a href="#" class="nav-item">🏠</span>Home</a>
      <a href="#" class="nav-item">🔍</span>Search</a>
      <a href="#" class="nav-item">📺</span>TV</a>
      <a href="#" class="nav-item">📥</span>Downloads</a>
      <a href="#" class="nav-item">⚙️</span>Settings</a>
    </nav>
  </div>

</body>
</html>
