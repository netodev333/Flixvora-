name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name override (blank = version.properties)'
        required: false
        default: ''
      version_code:
        description: 'Version code override (blank = version.properties)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_SDK_ROOT"
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            cd "$ANDROID_SDK_ROOT"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mkdir -p cmdline-tools
            mv cmdline-tools cmdline-tools/latest
            rm cmdline-tools.zip
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
          cat > key.properties << EOP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOP

      - name: Resolve version
        id: version
        run: |
          FILE_NAME=$(grep -E '^versionName=' version.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          FILE_CODE=$(grep -E '^versionCode=' version.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          NAME="${{ github.event.inputs.version_name }}"
          CODE="${{ github.event.inputs.version_code }}"
          [ -z "$NAME" ] && NAME="$FILE_NAME"
          [ -z "$CODE" ] && CODE="$FILE_CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Flixvora $NAME ($CODE)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Get APK path
        id: apk
        run: |
          APK_PATH=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No signed app-release.apk produced" >&2
            exit 1
          fi
          cp "$APK_PATH" Flixvora.apk
          echo "path=Flixvora.apk" >> "$GITHUB_OUTPUT"

      - name: Get APK info
        id: apk_info
        run: |
          SHA256=$(sha256sum "${{ steps.apk.outputs.path }}" | cut -d' ' -f1)
          SIZE=$(stat -c%s "${{ steps.apk.outputs.path }}")
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Create version.json
        run: |
          cat > version.json << EOV
          {
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "sha256": "${{ steps.apk_info.outputs.sha256 }}",
            "size": ${{ steps.apk_info.outputs.size }},
            "url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.name }}/Flixvora.apk",
            "releaseNotes": "Flixvora v${{ steps.version.outputs.name }} - built from ${{ github.sha }}"
          }
          EOV
          cat version.json

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Flixvora v${{ steps.version.outputs.name }}
          make_latest: true
          body: |
            ## Flixvora v${{ steps.version.outputs.name }}

            - Version code: `${{ steps.version.outputs.code }}`
            - Commit: `${{ github.sha }}`
            - Built by GitHub Actions (run ${{ github.run_id }})

            **SHA256:** `${{ steps.apk_info.outputs.sha256 }}`
            **Size:** ${{ steps.apk_info.outputs.size }} bytes
          files: |
            ${{ steps.apk.outputs.path }}
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flixvora-${{ steps.version.outputs.name }}-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
