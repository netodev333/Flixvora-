name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 9.7)'
        required: true
        default: '9.7'
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '46'

env:
  JAVA_VERSION: '21'
  ANDROID_SDK_VERSION: '36'
  BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}
          ndk-version: 'r27c'

      - name: Decode Keystore
        id: keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=release-key.jks" >> key.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PupdateManifestUrl="https://github.com/${{ github.repository }}/releases/latest/download/version.json" \
            -PversionName="${{ github.event.inputs.version_name || '9.7' }}" \
            -PversionCode="${{ github.event.inputs.version_code || '46' }}"
        env:
          ORG_GRADLE_PROJECT_versionName: ${{ github.event.inputs.version_name || '9.7' }}
          ORG_GRADLE_PROJECT_versionCode: ${{ github.event.inputs.version_code || '46' }}

      - name: Get APK path
        id: apk
        run: |
          APK_PATH=$(find . -name "app-release.apk" -type f | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Get APK info
        id: apk_info
        run: |
          SHA256=$(sha256sum "${{ steps.apk.outputs.path }}" | cut -d' ' -f1)
          SIZE=$(stat -c%s "${{ steps.apk.outputs.path }}")
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Create version.json
        id: version_json
        run: |
          cat > version.json << EOV
          {
            "versionName": "${{ github.event.inputs.version_name || '9.7' }}",
            "versionCode": ${{ github.event.inputs.version_code || '46' }},
            "sha256": "${{ steps.apk_info.outputs.sha256 }}",
            "size": ${{ steps.apk_info.outputs.size }},
            "url": "https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version_name || '9.7' }}/Flixvora.apk",
            "releaseNotes": "Flixvora v${{ github.event.inputs.version_name || '9.7' }} - Built via GitHub Actions"
          }
          EOV
          cat version.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ github.event.inputs.version_name || '9.7' }}
          name: Flixvora v${{ github.event.inputs.version_name || '9.7' }}
          body: |
            ## Flixvora v${{ github.event.inputs.version_name || '9.7' }}
            
            Built via GitHub Actions on ${{ github.run_id }}
            
            **SHA256:** ${{ steps.apk_info.outputs.sha256 }}
            **Size:** ${{ steps.apk_info.outputs.size }} bytes
          files: |
            ${{ steps.apk.outputs.path }}#Flixvora.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flixvora-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Upload version.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-manifest
          path: version.json
          retention-days: 30
