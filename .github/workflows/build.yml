name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 9.7)'
        required: true
        default: '9.7'
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '46'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          # Install Android SDK using sdkmanager
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_SDK_ROOT"
          
          # Download cmdline-tools if not present
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            cd "$ANDROID_SDK_ROOT"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mkdir -p cmdline-tools
            mv cmdline-tools cmdline-tools/latest
            rm cmdline-tools.zip
          fi
          
          # Accept licenses and install platforms
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
          cat > key.properties << EOP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOP

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ github.event.inputs.version_name || '9.7' }}" \
            -PversionCode="${{ github.event.inputs.version_code || '46' }}" \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g"
        env:
          ORG_GRADLE_PROJECT_versionName: ${{ github.event.inputs.version_name || '9.7' }}
          ORG_GRADLE_PROJECT_versionCode: ${{ github.event.inputs.version_code || '46' }}

      - name: Get APK path
        id: apk
        run: |
          APK_PATH=$(find . -name "app-release.apk" -type f | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Get APK info
        id: apk_info
        run: |
          SHA256=$(sha256sum "${{ steps.apk.outputs.path }}" | cut -d' ' -f1)
          SIZE=$(stat -c%s "${{ steps.apk.outputs.path }}")
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Create version.json
        run: |
          cat > version.json << EOV
          {
            "versionName": "${{ github.event.inputs.version_name || '9.7' }}",
            "versionCode": ${{ github.event.inputs.version_code || '46' }},
            "sha256": "${{ steps.apk_info.outputs.sha256 }}",
            "size": ${{ steps.apk_info.outputs.size }},
            "url": "https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version_name || '9.7' }}/Flixvora.apk",
            "releaseNotes": "Flixvora v${{ github.event.inputs.version_name || '9.7' }} - Built via GitHub Actions"
          }
          EOV
          cat version.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version_name || '9.7' }}
          name: Flixvora v${{ github.event.inputs.version_name || '9.7' }}
          body: |
            ## Flixvora v${{ github.event.inputs.version_name || '9.7' }}
            
            Built via GitHub Actions on ${{ github.run_id }}
            
            **SHA256:** ${{ steps.apk_info.outputs.sha256 }}
            **Size:** ${{ steps.apk_info.outputs.size }} bytes
          files: |
            ${{ steps.apk.outputs.path }}
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flixvora-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
